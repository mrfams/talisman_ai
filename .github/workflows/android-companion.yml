name: Android companion APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the removed `tools` package.
          packages: platform-tools

      - name: Accept licenses and install API 34
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build the debug APK
        working-directory: vendor/claw-use-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and name the APK
        run: |
          apk="vendor/claw-use-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" "talisman-companion-0.1.0-debug.apk"
          sha256sum "talisman-companion-0.1.0-debug.apk"

      - name: Upload the workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: talisman-companion-debug
          path: talisman-companion-0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish a phone-downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="companion-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "talisman-companion-0.1.0-debug.apk" \
            --title "Talisman Companion 0.1.0 (debug ${GITHUB_RUN_NUMBER})" \
            --notes "Debug-signed Android companion built from ${GITHUB_SHA}. Android 8.0+ (API 26). Sideload only; this build cannot be published on Google Play because it uses an AccessibilityService." \
            --prerelease
          echo "Download this release on your phone: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
